<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InfraHub TV Monitor</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    label { display:block; margin-top:16px; font-weight:700; }
    input { width:100%; box-sizing:border-box; padding:10px; margin-top:6px; }
    button { margin-top:20px; padding:10px 16px; cursor:pointer; }
    #status { margin-top:16px; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <h1>InfraHub TV Monitor</h1>
  <p>Configure a API, o ID da TV e o token exclusivo desta máquina.</p>
  <p id="version" style="font-size:13px;color:#666;margin-top:6px">Versão instalada: verificando...</p>

  <label for="apiUrl">API URL</label>
  <input id="apiUrl" type="url">

  <label for="maquinaId">ID da máquina</label>
  <input id="maquinaId" type="text" placeholder="tv-recepcao">

  <label for="token">Token</label>
  <input id="token" type="password" autocomplete="off">

  <button id="save">Salvar configuração</button>
  <div id="status" role="status" aria-live="polite"></div>

  <hr style="margin:28px 0 18px">
  <h2>Diagnóstico local</h2>
  <p>Últimos eventos guardados nesta TV. Os registros ficam no navegador e não são enviados automaticamente ao servidor.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="refreshLogs" type="button">Atualizar logs</button>
    <button id="exportLogs" type="button">Exportar logs JSON</button>
  </div>
  <label for="logs">Eventos recentes</label>
  <textarea id="logs" rows="12" readonly style="width:100%;box-sizing:border-box;margin-top:6px;font-family:monospace;font-size:12px"></textarea>

  <script src="options.js"></script>
</body>
</html>
